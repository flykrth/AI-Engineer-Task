[project]
name = "team-chat-qa"
version = "0.1.0"
description = "Temporal WhatsApp team chat analyzer and grounded Q&A CLI"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
